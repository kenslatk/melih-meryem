<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgililer Günümüz ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
body{
background:black;
color:white;
overflow:hidden;
}

/* INTRO */
#intro{
position:fixed;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:40px;
background:black;
z-index:10;
animation:fadeOut 2s ease forwards;
animation-delay:20s;
}

#intro h1{
font-size:2em;
}

/* SLIDESHOW */
#slideshow{
display:none;
position:fixed;
width:100%;
height:100vh;
}

.slide{
position:absolute;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
}

.slide.active{
display:flex;
}

/* BLUR BG */
.bg-blur{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
filter:blur(20px);
transform:scale(1.2);
}

/* FOTO FRAME */
.photo-frame{
position:relative;
max-width:90vw;
max-height:90vh;
display:flex;
justify-content:center;
align-items:center;
}

.photo-frame img{
max-width:100%;
max-height:100%;
object-fit:contain;
border-radius:20px;
box-shadow:0 0 40px rgba(255,0,80,0.6);
}

/* MESAJ */
#message{
position:absolute;
bottom:40px;
width:100%;
text-align:center;
font-size:1.2em;
padding:0 20px;
}

/* KALP */
.heart{
position:fixed;
bottom:-20px;
font-size:20px;
color:#ff4d6d;
animation:floatUp linear forwards;
pointer-events:none;
z-index:9999;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-110vh);opacity:0;}
}

@keyframes fadeOut{
to{opacity:0;visibility:hidden;}
}

/* FINAL */
#finalMessage{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:3em;
display:none;
z-index:10000;
text-shadow:0 0 30px red;
}
</style>
</head>
<body>

<div id="intro">
<h1>
İLK SEVGİLİLER GÜNÜMÜZ KUTLU OLSUN ❤️<br><br>
Seninle yan yana olmak, sana güvenmek, yanında kendim gibi olabilmek…
Bu his her şeyden daha değerli.<br><br>
Nice sevgililer günlerine, hep birlikte…
</h1>
</div>

<div id="slideshow">
<div id="slides"></div>
<div id="message"></div>
</div>

<div id="finalMessage">SENİ SEVİYORUM ❤️</div>

<audio id="bgMusic"></audio>

<script>

/* FOTO OLUŞTUR */
const slidesContainer=document.getElementById("slides");
const slides=[];
for(let i=1;i<=20;i++){
let slide=document.createElement("div");
slide.className="slide";

let blur=document.createElement("div");
blur.className="bg-blur";
blur.style.backgroundImage=`url(foto${i}.jpg)`;

let frame=document.createElement("div");
frame.className="photo-frame";

let img=document.createElement("img");
img.src=`foto${i}.jpg`;

frame.appendChild(img);
slide.appendChild(blur);
slide.appendChild(frame);
slidesContainer.appendChild(slide);
slides.push(slide);
}

/* MESAJLAR */
const messages=[
"Seninle başlayan her an başka güzel...",
"Bakışların içimi ısıtıyor ❤️",
"Yanında her şey daha kolay.",
"En huzurlu yer senin yanın.",
"Birlikte güldüğümüz her an paha biçilemez.",
"Kalbim seninle tamam.",
"Hayatımın en güzel tesadüfü sensin.",
"Elini tutmak bile yetiyor.",
"İyi ki varsın.",
"Her anım seninle daha anlamlı.",
"Yanında kendim olabiliyorum.",
"Güvenmek böyle bir şeymiş.",
"Birlikte büyüyoruz.",
"Birlikte güçlüyüz.",
"Birlikte mutluyuz.",
"Yan yana, omuz omuza.",
"Sen benim en güzel alışkanlığımsın.",
"Kalbim hep seninle.",
"Biz bir takımız.",
"Ve hep öyle kalacağız ❤️"
];

let current=0;
let interval;
const messageEl=document.getElementById("message");

/* YAZI EFEKTİ */
function typeWriter(text){
messageEl.textContent="";
let i=0;
let typing=setInterval(()=>{
messageEl.textContent+=text[i];
i++;
if(i>=text.length)clearInterval(typing);
},40);
}

function showSlide(index){
slides.forEach(s=>s.classList.remove("active"));
slides[index].classList.add("active");
typeWriter(messages[index]);
}

/* SLIDESHOW */
function startSlideshow(){
interval=setInterval(()=>{
current++;
if(current>=slides.length){
clearInterval(interval);
finalScene();
return;
}
showSlide(current);
},5000);
}

/* INTRO BİTİNCE */
setTimeout(()=>{
document.getElementById("slideshow").style.display="block";
showSlide(0);
setTimeout(()=>{
startSlideshow();
},5000);
startHearts(600);
startMusic();
},20000);

/* KALP */
function startHearts(speed){
setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.textContent="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*30)+"px";
heart.style.animationDuration=(4+Math.random()*3)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),7000);
},speed);
}

/* FINAL */
function finalScene(){
startHearts(100);
document.getElementById("finalMessage").style.display="block";
}

/* MÜZİK */
const bgMusic=document.getElementById("bgMusic");
const tracks=[
{src:"song1.mp3",loop:false},
{src:"song2.mp3",loop:false},
{src:"song3.mp3",loop:true}
];
let trackIndex=0;

function startMusic(){
playTrack(trackIndex);
}

function playTrack(i){
bgMusic.src=tracks[i].src;
bgMusic.loop=tracks[i].loop;

bgMusic.addEventListener("loadedmetadata",function setStart(){
if(i===2){
bgMusic.currentTime=30;
}
bgMusic.removeEventListener("loadedmetadata",setStart);
});

bgMusic.play();
}

bgMusic.addEventListener("ended",()=>{
trackIndex++;
if(trackIndex<tracks.length){
playTrack(trackIndex);
}
});
</script>

</body>
</html>
