<script>

/* INTRO 20 SANİYE */
setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("slideshow").style.display="flex";
},20000);


/* FOTO YÜKLEME */
const slidesContainer = document.getElementById("slides");
const slides = [];

for(let i=1;i<=20;i++){
    const div = document.createElement("div");
    div.classList.add("slide");

    const blur = document.createElement("div");
    blur.classList.add("bg-blur");
    blur.style.backgroundImage = `url(foto${i}.jpg)`;

    const frame = document.createElement("div");
    frame.classList.add("photo-frame");

    const img = document.createElement("img");
    img.src = `foto${i}.jpg`;

    frame.appendChild(img);
    div.appendChild(blur);
    div.appendChild(frame);

    slidesContainer.appendChild(div);
    slides.push(div);
}

const messages = [
"Seni her şeyden çok seviyorum 💖",
"Yanında huzur buluyorum ❤️",
"Seninle hayat daha anlamlı ✨",
"Gülüşün içimi ısıtıyor 💕",
"Birlikte güçlüyüz 💞",
"Yanında kendim olabiliyorum 💓",
"Sana güvenmek çok güzel 🌹",
"Rahat hissetmek paha biçilemez 💘",
"Hayatımın en güzel parçasısın 💝",
"Sonsuza kadar seninleyim 💖",
"Her günüm seninle özel 💕",
"Kalbim sana ait ❤️",
"Birlikte her şeyi aşarız 💞",
"Sen benim huzurumsun 💓",
"Yan yana olmak en güzeli 🌹",
"Gözlerine bakmak bile yetiyor 💘",
"Aşkımız hep büyüsün 💖",
"Sen benim evimsin 💕",
"Kalbim hep sana dönük ❤️",
"Hep yan yana kalalım 💞"
];

let current = 0;
const messageEl = document.getElementById("message");
let heartInterval;

/* Yazı efekti */
function typeWriter(text){
    messageEl.textContent="";
    let i=0;
    let typing=setInterval(()=>{
        messageEl.textContent+=text[i];
        i++;
        if(i>=text.length) clearInterval(typing);
    },40);
}

function showSlide(index){
    slides.forEach(s=>s.classList.remove("active"));
    slides[index].classList.add("active");
    typeWriter(messages[index]);

    /* SON SLAYT KONTROL */
    if(index === slides.length-1){
        startFinale();
    }
}

showSlide(current);

setInterval(()=>{
    if(document.getElementById("slideshow").style.display==="flex"){
        current=(current+1)%slides.length;
        showSlide(current);
    }
},5000);


/* =======================
   KALP YAĞMURU
======================= */

function startHearts(speed=500){
    clearInterval(heartInterval);
    heartInterval = setInterval(()=>{
        const heart=document.createElement("div");
        heart.classList.add("heart");
        heart.style.left=Math.random()*100+"vw";
        heart.style.animationDuration = (4 + Math.random()*3) + "s";
        heart.style.fontSize = (18 + Math.random()*25) + "px";
        heart.textContent="❤";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),7000);
    },speed);
}

/* NORMAL YOĞUNLUK */
startHearts(500);


/* =======================
   FİNAL PATLAMASI
======================= */

function startFinale(){

    /* Kalp hızını arttır */
    startHearts(150);

    /* Büyük yazı oluştur */
    const finalText=document.createElement("div");
    finalText.innerHTML="SENİ SEVİYORUM ❤️";
    finalText.style.position="fixed";
    finalText.style.top="50%";
    finalText.style.left="50%";
    finalText.style.transform="translate(-50%, -50%) scale(0.5)";
    finalText.style.color="white";
    finalText.style.fontSize="4em";
    finalText.style.fontWeight="bold";
    finalText.style.textShadow="0 0 40px red";
    finalText.style.zIndex="99999";
    finalText.style.opacity="0";
    finalText.style.transition="all 2s ease";

    document.body.appendChild(finalText);

    setTimeout(()=>{
        finalText.style.opacity="1";
        finalText.style.transform="translate(-50%, -50%) scale(1)";
    },200);
}


/* =======================
   MÜZİK
======================= */

const tracks=[
    {src:"song1.mp3",loop:false},
    {src:"song2.mp3",loop:false},
    {src:"song3.mp3",loop:true}
];

let trackIndex=0;
const bgMusic=document.getElementById("bgMusic");

function playTrack(i){
    bgMusic.src=tracks[i].src;
    bgMusic.loop=tracks[i].loop;
    bgMusic.play();
}

document.body.addEventListener("click",()=>{
    playTrack(trackIndex);
},{once:true});

bgMusic.addEventListener("ended",()=>{
    if(trackIndex<tracks.length-1){
        trackIndex++;
        playTrack(trackIndex);
    }
});

</script>
