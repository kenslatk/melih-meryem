<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İlk Sevgililer Günümüz ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    background:black;
}

/* INTRO */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    z-index:10;
    padding:20px;
    background:black;
}

#intro h1{
    font-size:3em;
    margin-bottom:20px;
}

#intro p{
    max-width:800px;
    font-size:1.4em;
    line-height:1.6em;
}

/* SLIDESHOW */
#slideshow{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:5;
}

.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1.5s ease;
}

.slide.active{
    opacity:1;
}

/* BLUR ARKA PLAN */
.bg-blur{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    filter:blur(35px) brightness(0.6);
    transform:scale(1.2);
}

/* FOTO ÇERÇEVESİ */
.photo-frame{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.photo-frame img{
    max-width:90vw;
    max-height:85vh;
    width:auto;
    height:auto;
    object-fit:contain;
    box-shadow:0 0 40px rgba(0,0,0,0.8);
    border-radius:12px;
}

/* Mesaj */
#message{
    position:absolute;
    bottom:50px;
    width:100%;
    text-align:center;
    color:white;
    font-size:1.8em;
    text-shadow:0 0 15px black;
}

/* Kalpler */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    color:#ff4d6d;
    animation:floatUp 6s linear infinite;
    z-index:2;
}

@keyframes floatUp{
    0%{ transform:translateY(0) scale(1); opacity:1;}
    100%{ transform:translateY(-110vh) scale(1.8); opacity:0;}
}
</style>
</head>

<body>

<div id="intro">
    <h1>İLK SEVGİLİLER GÜNÜMÜZ KUTLU OLSUN ❤️</h1>
    <p>
        Seninle yan yana olmak bana huzur veriyor.
        Sana güvenmek, yanında rahat olmak,
        birlikte hayatı paylaşabilmek…
        Umarım hep yan yana,
        hep güvenle,
        hep huzurla devam ederiz. 💖
    </p>
</div>

<div id="slideshow">
    <div id="slides"></div>
    <div id="message"></div>
</div>

<audio id="bgMusic" controls></audio>

<script>

/* INTRO 20 SANİYE */
setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("slideshow").style.display="flex";
},20000);


/* FOTO YÜKLEME */
const slidesContainer = document.getElementById("slides");
const slides = [];

for(let i=1;i<=20;i++){
    const div = document.createElement("div");
    div.classList.add("slide");

    /* BLUR BACKGROUND */
    const blur = document.createElement("div");
    blur.classList.add("bg-blur");
    blur.style.backgroundImage = `url(foto${i}.jpg)`;

    /* NET FOTO */
    const frame = document.createElement("div");
    frame.classList.add("photo-frame");

    const img = document.createElement("img");
    img.src = `foto${i}.jpg`;

    frame.appendChild(img);

    div.appendChild(blur);
    div.appendChild(frame);

    slidesContainer.appendChild(div);
    slides.push(div);
}

const messages = [
"Seni her şeyden çok seviyorum 💖",
"Yanında huzur buluyorum ❤️",
"Seninle hayat daha anlamlı ✨",
"Gülüşün içimi ısıtıyor 💕",
"Birlikte güçlüyüz 💞",
"Yanında kendim olabiliyorum 💓",
"Sana güvenmek çok güzel 🌹",
"Rahat hissetmek paha biçilemez 💘",
"Hayatımın en güzel parçasısın 💝",
"Sonsuza kadar seninleyim 💖",
"Her günüm seninle özel 💕",
"Kalbim sana ait ❤️",
"Birlikte her şeyi aşarız 💞",
"Sen benim huzurumsun 💓",
"Yan yana olmak en güzeli 🌹",
"Gözlerine bakmak bile yetiyor 💘",
"Aşkımız hep büyüsün 💖",
"Sen benim evimsin 💕",
"Kalbim hep sana dönük ❤️",
"Hep yan yana kalalım 💞"
];

let current = 0;
const messageEl = document.getElementById("message");

function typeWriter(text){
    messageEl.textContent="";
    let i=0;
    let typing=setInterval(()=>{
        messageEl.textContent+=text[i];
        i++;
        if(i>=text.length) clearInterval(typing);
    },40);
}

function showSlide(index){
    slides.forEach(s=>s.classList.remove("active"));
    slides[index].classList.add("active");
    typeWriter(messages[index]);
}

showSlide(current);

setInterval(()=>{
    if(document.getElementById("slideshow").style.display==="flex"){
        current=(current+1)%slides.length;
        showSlide(current);
    }
},5000);


/* MÜZİK */
const tracks=[
    {src:"song1.mp3",loop:false},
    {src:"song2.mp3",loop:false},
    {src:"song3.mp3",loop:true}
];

let trackIndex=0;
const bgMusic=document.getElementById("bgMusic");

function playTrack(i){
    bgMusic.src=tracks[i].src;
    bgMusic.loop=tracks[i].loop;
    bgMusic.play();
}

document.body.addEventListener("click",()=>{
    playTrack(trackIndex);
},{once:true});

bgMusic.addEventListener("ended",()=>{
    if(trackIndex<tracks.length-1){
        trackIndex++;
        playTrack(trackIndex);
    }
});


/* KALP OLUŞTUR */
setInterval(()=>{
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.style.left=Math.random()*100+"vw";
    heart.textContent="❤";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
},800);

</script>

</body>
</html>
