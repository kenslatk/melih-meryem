<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgililer Günü 💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    background:url("background.jpg") center center no-repeat fixed;
    background-size:cover;
}

/* KARARTMA */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(4px);
    z-index:1;
}

#intro{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    z-index:3;
    padding:20px;
}

#intro h1{
    font-size:3em;
    margin-bottom:20px;
}

#intro p{
    max-width:800px;
    font-size:1.4em;
}

#slideshow{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:3;
}

.slide{
    display:none;
    width:100%;
    height:100%;
    justify-content:center;
    align-items:center;
}

.slide.active{
    display:flex;
}

.slide img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
}

#message{
    color:white;
    font-size:1.6em;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div id="intro">
    <h1>İLK SEVGİLİLER GÜNÜMÜZ KUTLU OLSUN ❤️</h1>
    <p>
        Seninle yan yana olmak bana huzur veriyor.
        Sana güvenmek, yanında rahat olmak,
        birlikte her şeyi paylaşabilmek…
        Bunların hepsi benim için çok değerli.
        Umarım hep yan yana,
        hep güvenle,
        hep rahat ve mutlu kalırız. 💖
    </p>
</div>

<div id="slideshow">
    <div id="slides"></div>
    <div id="message"></div>
</div>

<audio id="bgMusic" controls></audio>

<script>

/* 20 SANİYE GİRİŞ */
setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("slideshow").style.display="flex";
},20000);


/* FOTOĞRAFLAR */
const slidesContainer = document.getElementById("slides");
const slides = [];

for(let i=1;i<=20;i++){
    const div = document.createElement("div");
    div.classList.add("slide");

    const img = document.createElement("img");
    img.src = `foto${i}.jpg`;

    div.appendChild(img);
    slidesContainer.appendChild(div);
    slides.push(div);
}

const messages = [
"Seni her şeyden çok seviyorum 💖",
"Yanında huzur buluyorum ❤️",
"Seninle hayat daha anlamlı ✨",
"Gülüşün dünyamı aydınlatıyor 💕",
"Birlikte güçlüyüz 💞",
"Yanında kendim olabiliyorum 💓",
"Sana güvenmek çok güzel 🌹",
"Rahat hissetmek paha biçilemez 💘",
"Hayatımın en güzel parçasısın 💝",
"Sonsuza kadar seninleyim 💖",
"Her günüm seninle özel 💕",
"Kalbim sana ait ❤️",
"Birlikte her şeyi aşarız 💞",
"Sen benim huzurumsun 💓",
"Yan yana olmak en güzeli 🌹",
"Gözlerine bakmak bile yetiyor 💘",
"Aşkımız hep büyüsün 💖",
"Sen benim evimsin 💕",
"Kalbim hep sana dönük ❤️",
"Hep yan yana kalalım 💞"
];

let current = 0;
const messageEl = document.getElementById("message");

function showSlide(index){
    slides.forEach((s,i)=>{
        s.classList.remove("active");
        if(i===index) s.classList.add("active");
    });
    messageEl.textContent = messages[index];
}

showSlide(current);

setInterval(()=>{
    if(document.getElementById("slideshow").style.display==="flex"){
        current = (current+1)%slides.length;
        showSlide(current);
    }
},4000);


/* MÜZİK */
const tracks = [
    {src:"song1.mp3", loop:false},
    {src:"song2.mp3", loop:false},
    {src:"song3.mp3", loop:true}
];

let trackIndex = 0;
const bgMusic = document.getElementById("bgMusic");

function playTrack(i){
    bgMusic.src = tracks[i].src;
    bgMusic.loop = tracks[i].loop;
    bgMusic.play();
}

document.body.addEventListener("click",()=>{
    playTrack(trackIndex);
},{once:true});

bgMusic.addEventListener("ended",()=>{
    if(trackIndex < tracks.length-1){
        trackIndex++;
        playTrack(trackIndex);
    }
});
</script>

</body>
</html>
