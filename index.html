<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgililer Günü 💖</title>

<style>
body {
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background: url("background.png") no-repeat center center fixed;
    background-size: cover;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    min-height:100vh;
}

/* KARARTMA EFEKTİ */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

#intro{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    background:rgba(0,0,0,0.6);
}

#intro h1{
    font-size:3em;
    margin-bottom:20px;
}

#intro p{
    font-size:1.4em;
    max-width:700px;
}

#slideshow-container{
    display:none;
    width:100%;
    text-align:center;
}

.slide{
    display:none;
}

.slide.active{
    display:block;
}

.slide img{
    width:100%;
    height:100vh;
    object-fit:contain; /* ASLA KESMEZ */
}

#message{
    color:white;
    font-size:1.6em;
    margin-top:15px;
}
</style>
</head>

<body>

<div id="intro">
    <h1>İLK SEVGİLİLER GÜNÜMÜZ KUTLU OLSUN ❤️</h1>
    <p>
        Seninle yan yana olmak bana huzur veriyor.
        Sana güvenmek, yanında rahat olmak,
        hayatı birlikte paylaşmak…
        Bunların hepsi benim için çok değerli.
        Umarım hep böyle yan yana,
        hep birbirimize güvenerek,
        hep rahat ve mutlu bir şekilde devam ederiz. 💖
    </p>
</div>

<div id="slideshow-container">
    <div id="slides"></div>
    <div id="message"></div>
</div>

<audio id="bgMusic" controls></audio>

<script>

/* 20 SANİYE GİRİŞ */
setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("slideshow-container").style.display="block";
},20000);


/* FOTOĞRAFLAR */
const slidesContainer = document.getElementById("slides");
const slides = [];

for(let i=1;i<=20;i++){
    const div = document.createElement("div");
    div.classList.add("slide");

    const img = document.createElement("img");
    img.src = `foto${i}.jpg`;

    div.appendChild(img);
    slidesContainer.appendChild(div);
    slides.push(div);
}

const messages = [
"Seni her şeyden çok seviyorum 💖",
"Seninle her an daha anlamlı...",
"Gülüşün içimi ısıtıyor ✨",
"Yanında huzur buluyorum ❤️",
"En güzel rastlantımsın 💕",
"Sana her gün yeniden aşık oluyorum 😘",
"Seninle her şey daha güzel 💞",
"Hayatımın en değerli parçasısın 💓",
"Yan yana olmak en güzeli 🌹",
"Sonsuza kadar seninleyim 💘",
"Her günüm seninle özel 💝",
"Kalbim sana ait ❤️",
"Birlikte güçlüyüz ✨",
"Güvenmek bu kadar güzelmiş 💕",
"Yanında kendim olabiliyorum 💖",
"Rahat ve huzurlu hissediyorum 💞",
"Aşkımız hep büyüsün 💓",
"Sen benim evimsin 🌹",
"Kalbim hep sana dönük 💘",
"Hep yan yana kalalım 💖"
];

let current = 0;
const messageEl = document.getElementById("message");

function showSlide(index){
    slides.forEach((s,i)=>{
        s.classList.remove("active");
        if(i===index) s.classList.add("active");
    });
    messageEl.textContent = messages[index];
}

showSlide(current);

setInterval(()=>{
    if(document.getElementById("slideshow-container").style.display==="block"){
        current = (current+1)%slides.length;
        showSlide(current);
    }
},4000);


/* MÜZİK */
const tracks = [
    {src:"song1.mp3", loop:false},
    {src:"song2.mp3", loop:false},
    {src:"song3.mp3", loop:true}
];

let trackIndex = 0;
const bgMusic = document.getElementById("bgMusic");

function playTrack(i){
    bgMusic.src = tracks[i].src;
    bgMusic.loop = tracks[i].loop;
    bgMusic.play();
}

document.body.addEventListener("click",()=>{
    playTrack(trackIndex);
},{once:true});

bgMusic.addEventListener("ended",()=>{
    if(trackIndex < tracks.length-1){
        trackIndex++;
        playTrack(trackIndex);
    }
});
</script>

</body>
</html>
