<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İlk Sevgililer Günümüz ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
    background:url("background.jpg") center center no-repeat fixed;
    background-size:cover;
}

/* KARARTMA + BLUR */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(6px);
    z-index:1;
}

/* INTRO */
#intro{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    z-index:3;
    padding:20px;
}

#intro h1{
    font-size:3em;
    margin-bottom:20px;
}

#intro p{
    max-width:800px;
    font-size:1.4em;
    line-height:1.6em;
}

/* SLIDER */
#slideshow{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:3;
}

.slide{
    position:absolute;
    inset:0;
    display:none;
}

.slide.active{
    display:block;
}

.slide img{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    
    max-width:100vw;
    max-height:100vh;

    width:auto;
    height:auto;
}

/* MESAJ */
#message{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    color:white;
    font-size:1.6em;
    text-shadow:0 0 10px black;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div id="intro">
    <h1>İLK SEVGİLİLER GÜNÜMÜZ KUTLU OLSUN ❤️</h1>
    <p>
        Seninle yan yana olmak bana huzur veriyor.
        Sana güvenmek, yanında rahat olmak,
        birlikte hayatı paylaşabilmek…
        Bunların hepsi benim için çok değerli.
        Umarım hep yan yana,
        hep güvenle,
        hep huzurla devam ederiz. 💖
    </p>
</div>

<div id="slideshow">
    <div id="slides"></div>
    <div id="message"></div>
</div>

<audio id="bgMusic" controls></audio>

<script>

/* 20 SANİYE GİRİŞ */
setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("slideshow").style.display="flex";
},20000);


/* FOTOĞRAFLAR */
const slidesContainer = document.getElementById("slides");
const slides = [];

for(let i=1;i<=20;i++){
    const div = document.createElement("div");
    div.classList.add("slide");

    const img = document.createElement("img");
    img.src = `foto${i}.jpg`;

    div.appendChild(img);
    slidesContainer.appendChild(div);
    slides.push(div);
}

const messages = [
"Seni her şeyden çok seviyorum 💖",
"Yanında huzur buluyorum ❤️",
"Seninle hayat daha anlamlı ✨",
"Gülüşün içimi ısıtıyor 💕",
"Birlikte güçlüyüz 💞",
"Yanında kendim olabiliyorum 💓",
"Sana güvenmek çok güzel 🌹",
"Rahat hissetmek paha biçilemez 💘",
"Hayatımın en güzel parçasısın 💝",
"Sonsuza kadar seninleyim 💖",
"Her günüm seninle özel 💕",
"Kalbim sana ait ❤️",
"Birlikte her şeyi aşarız 💞",
"Sen benim huzurumsun 💓",
"Yan yana olmak en güzeli 🌹",
"Gözlerine bakmak bile yetiyor 💘",
"Aşkımız hep büyüsün 💖",
"Sen benim evimsin 💕",
"Kalbim hep sana dönük ❤️",
"Hep yan yana kalalım 💞"
];

let current = 0;
const messageEl = document.getElementById("message");

function showSlide(index){
    slides.forEach((s,i)=>{
        s.classList.remove("active");
        if(i===index) s.classList.add("active");
    });
    messageEl.textContent = messages[index];
}

showSlide(current);

setInterval(()=>{
    if(document.getElementById("slideshow").style.display==="flex"){
        current = (current+1)%slides.length;
        showSlide(current);
    }
},4000);


/* MÜZİK */
const tracks = [
    {src:"song1.mp3", loop:false},
    {src:"song2.mp3", loop:false},
    {src:"song3.mp3", loop:true}
];

let trackIndex = 0;
const bgMusic = document.getElementById("bgMusic");

function playTrack(i){
    bgMusic.src = tracks[i].src;
    bgMusic.loop = tracks[i].loop;
    bgMusic.play();
}

document.body.addEventListener("click",()=>{
    playTrack(trackIndex);
},{once:true});

bgMusic.addEventListener("ended",()=>{
    if(trackIndex < tracks.length-1){
        trackIndex++;
        playTrack(trackIndex);
    }
});
</script>

</body>
</html>
