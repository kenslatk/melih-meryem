<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İlk Sevgililer Günümüz ❤️</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
overflow:hidden;
color:white;
background:url("background.jpg") no-repeat center center fixed;
background-size:cover;
}

/* KARARTMA */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* INTRO */
#intro{
position:fixed;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
text-align:center;
z-index:5;
}

#intro h1{
font-size:28px;
max-width:800px;
}

/* SLIDESHOW */
#slideshow{
display:none;
width:100%;
height:100vh;
position:relative;
}

.slide{
position:absolute;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
}

.slide.active{
display:flex;
}

.slide img{
max-width:90vw;
max-height:75vh;
object-fit:contain;
border-radius:15px;
box-shadow:0 0 40px rgba(255,0,80,0.6);
}

.message{
margin-top:20px;
font-size:20px;
padding:0 20px;
}

/* KALP */
.heart{
position:fixed;
bottom:-20px;
color:#ff4d6d;
animation:rise linear forwards;
pointer-events:none;
z-index:10;
}

@keyframes rise{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-110vh);opacity:0;}
}

/* FINAL */
#final{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:50px;
display:none;
z-index:20;
text-shadow:0 0 30px red;
}
</style>
</head>
<body>

<div id="intro">
<h1>
İLK SEVGİLİLER GÜNÜMÜZ KUTLU OLSUN ❤️<br><br>
Seninle yan yana olmak, güvenmek, rahat olmak…
Bunların hepsi seninle mümkün.<br><br>
Nice birlikte geçireceğimiz günlere…
</h1>
</div>

<div id="slideshow"></div>
<div id="final">SENİ SEVİYORUM ❤️</div>

<audio id="music"></audio>

<script>

const totalPhotos = 20;
const slideshow = document.getElementById("slideshow");

const messages = [
"Seninle başlayan her an başka güzel...",
"Yanında her şey daha kolay ❤️",
"Birlikte gülmek en sevdiğim şey.",
"Elini tutmak huzur demek.",
"İyi ki varsın.",
"Kalbim seninle tamam.",
"Hayatımın en güzel parçasısın.",
"Yanında kendim olabiliyorum.",
"Güvenmek böyle bir şeymiş.",
"Birlikte güçlüyüz.",
"Birlikte mutluyuz.",
"Yan yana olmak yetiyor.",
"Sen benim en güzel alışkanlığımsın.",
"Kalbim hep seninle.",
"Biz bir takımız.",
"Omuz omuza her şey mümkün.",
"Gözlerine bakmak bile yeter.",
"En huzurlu yer senin yanın.",
"İyi ki biz olduk.",
"Ve hep öyle kalacağız ❤️"
];

/* FOTO OLUŞTUR */
for(let i=1;i<=totalPhotos;i++){
let slide=document.createElement("div");
slide.className="slide";

let img=document.createElement("img");
img.src="foto"+i+".jpg";

let text=document.createElement("div");
text.className="message";
text.textContent=messages[i-1] || "";

slide.appendChild(img);
slide.appendChild(text);
slideshow.appendChild(slide);
}

const slides=document.querySelectorAll(".slide");
let current=0;

/* INTRO */
setTimeout(()=>{
document.getElementById("intro").style.display="none";
slideshow.style.display="block";
showSlide(0);
setTimeout(startSlideshow,5000);
startHearts(600);
startMusic();
},20000);

function showSlide(index){
slides.forEach(s=>s.classList.remove("active"));
slides[index].classList.add("active");
}

function startSlideshow(){
setInterval(()=>{
current++;
if(current>=slides.length){
finalScene();
return;
}
showSlide(current);
},5000);
}

/* KALP */
function startHearts(speed){
setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.textContent="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*30)+"px";
heart.style.animationDuration=(4+Math.random()*3)+"s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),7000);
},speed);
}

/* FINAL */
function finalScene(){
document.getElementById("final").style.display="block";
startHearts(100);
}

/* MÜZİK */
const music=document.getElementById("music");
const tracks=[
{src:"song1.mp3",loop:false},
{src:"song2.mp3",loop:false},
{src:"song3.mp3",loop:true}
];
let trackIndex=0;

function startMusic(){
playTrack(trackIndex);
}

function playTrack(i){
music.src=tracks[i].src;
music.loop=tracks[i].loop;

music.addEventListener("loadedmetadata",function setStart(){
if(i===2){
music.currentTime=30;
}
music.removeEventListener("loadedmetadata",setStart);
});

music.play();
}

music.addEventListener("ended",()=>{
trackIndex++;
if(trackIndex<tracks.length){
playTrack(trackIndex);
}
});
</script>

</body>
</html>
